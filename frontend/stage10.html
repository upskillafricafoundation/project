<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UAF M&E/L · Donor Reporting</title><script src="config.js"></script><style>body{font-family:Arial;margin:0;background:#f4f6f9;color:#172033}header{background:#123b8e;color:#fff;padding:20px 24px}main{max-width:1200px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 8px #0001;margin-bottom:16px}.num{font-size:30px;font-weight:700}button{background:#123b8e;color:#fff;border:0;border-radius:7px;padding:10px 14px;cursor:pointer;margin:4px}input,select{padding:10px;border:1px solid #ccd2dc;border-radius:7px;width:95%}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #eee;font-size:13px}</style></head><body><header><b>Upskill Africa Foundation</b><div>Stage 10 · Donor Reporting & Report Management</div></header><main><div class="card"><select id="project"><option value="">Select project</option></select><button onclick="load()">Refresh</button><button onclick="location.href='index.html'">Main M&E/L</button></div><div class="grid"><div class="card">Reports<div class="num" id="reports">0</div></div><div class="card">Overdue<div class="num" id="due">0</div></div><div class="card">Pending Approval<div class="num" id="pending">0</div></div><div class="card">Evidence<div class="num" id="evidence">0</div></div><div class="card">Unverified Evidence<div class="num" id="unverified">0</div></div></div><div class="card"><h2>Create Reporting Period</h2><input id="type" placeholder="Report type (e.g. Quarterly Narrative)"><input id="start" type="date"><input id="end" type="date"><input id="dueDate" type="date"><button onclick="createPeriod()">Create Period</button></div><div class="card"><h2>Reporting Periods</h2><div id="periods">Select a project.</div></div></main><script>const $=x=>document.getElementById(x);async function api(q,o){if(!API_URL||API_URL==='YOUR_APPS_SCRIPT_EXEC_URL')throw Error('Set the Apps Script /exec URL in frontend/config.js.');return(await fetch(API_URL+q,o)).json()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function loadProjects(){try{let r=await api('?action=list&sheet=Projects');$('project').innerHTML='<option value="">Select project</option>'+(r.data||[]).map(x=>'<option value="'+esc(x['Project ID'])+'">'+esc(x['Project Name'])+'</option>').join('')}catch(e){}}async function load(){let p=$('project').value;if(!p)return;try{let d=await api('?action=reportingDashboard&projectId='+encodeURIComponent(p));$('reports').textContent=d.reports;$('due').textContent=d.due;$('pending').textContent=d.pendingApproval;$('evidence').textContent=d.evidence;$('unverified').textContent=d.unverifiedEvidence;let r=await api('?action=reportPeriods&projectId='+encodeURIComponent(p));$('periods').innerHTML='<table><tr><th>Type</th><th>Period</th><th>Due</th><th>Status</th><th>Action</th></tr>'+(r.data||[]).map(x=>'<tr><td>'+esc(x['Report Type'])+'</td><td>'+esc(x['Period Start'])+' – '+esc(x['Period End'])+'</td><td>'+esc(x['Due Date'])+'</td><td>'+esc(x.Status)+'</td><td><button onclick="generate(\''+esc(x['Period ID'])+'\')">Generate Report</button></td></tr>').join('')+'</table>'}catch(e){alert(e.message)}}async function createPeriod(){let p=$('project').value;if(!p)return alert('Select a project.');try{await api('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'createStage10Record',entity:'reportPeriod',data:{'Project ID':p,'Report Type':$('type').value,'Period Start':$('start').value,'Period End':$('end').value,'Due Date':$('dueDate').value,Status:'Draft'}})});load()}catch(e){alert(e.message)}}async function generate(id){let p=$('project').value;try{let r=await api('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'generateDonorReport',projectId:p,periodId:id})});if(r.url)window.open(r.url,'_blank');load()}catch(e){alert(e.message)}}loadProjects()</script></body></html>
