<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UAF M&E/L — Stage 19</title><script src="config.js"></script><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{background:#fff;padding:22px;border-bottom:1px solid #ddd}main{max-width:1200px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.card,.panel{background:#fff;border:1px solid #e1e6ee;border-radius:12px;padding:18px}.num{font-size:27px;font-weight:700;margin-top:8px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{padding:10px 13px;border:1px solid #ccd3df;border-radius:8px;background:#fff}.panel{display:none}.panel.active{display:block}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}small{color:#667085}</style></head><body><header><main><h1>Stage 19 — Gender Equality, Equity, Disability & Social Inclusion</h1><small>Assess → Disaggregate → Identify Barriers → Adapt → Participate → Measure → Improve</small></main></header><main><div id="cards" class="grid"></div><div class="tabs"><button onclick="show('assess')">Assessments</button><button onclick="show('ind')">Indicators</button><button onclick="show('gender')">Gender Analysis</button><button onclick="show('dis')">Disability Inclusion</button><button onclick="show('part')">Participation Equity</button><button onclick="show('safe')">Safe Inclusion</button><button onclick="show('actions')">Actions</button><button onclick="show('complaints')">Complaints</button><button onclick="show('alerts')">Alerts</button></div><div id="assess" class="panel active"></div><div id="ind" class="panel"></div><div id="gender" class="panel"></div><div id="dis" class="panel"></div><div id="part" class="panel"></div><div id="safe" class="panel"></div><div id="actions" class="panel"></div><div id="complaints" class="panel"></div><div id="alerts" class="panel"></div></main><script>const esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const $=id=>document.getElementById(id);function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}function tab(rows,cols){if(!rows||!rows.length)return'<p>No records.</p>';return'<div style="overflow:auto"><table><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>'+rows.slice(0,100).map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join('')+'</tr>').join('')+'</table></div>'}async function load(){try{if(!API_URL||API_URL==='YOUR_APPS_SCRIPT_EXEC_URL')throw Error('Set the Apps Script /exec URL in frontend/config.js.');let r=await fetch(API_URL+'?action=gediDashboard'),x=await r.json();if(!x.ok)throw Error(x.error);let d=x.data,s=d.summary;let cards=[['Assessments',s.assessments],['Inclusion Score',s.inclusionScore+'%'],['GEDI Indicators',s.indicators],['Gender Analyses',s.genderAnalyses],['Disability Records',s.disabilityRecords],['Beneficiary Records',s.beneficiaryRecords],['Participation Records',s.participationRecords],['Safe Inclusion',s.inclusionCompliance+'%'],['Open Actions',s.openActions],['Commitments',s.commitments],['Open Complaints',s.openComplaints],['Open Alerts',s.openAlerts]];$('cards').innerHTML=cards.map(x=>'<div class="card"><small>'+x[0]+'</small><div class="num">'+esc(x[1])+'</div></div>').join('');$('assess').innerHTML=tab(d.assessments,['Date','Activity/Area','Gender Inclusion','Disability Inclusion','Child Inclusion','Economic Inclusion','Geographic Inclusion','Overall Score','Gaps','Status']);$('ind').innerHTML=tab(d.indicators,['Theme','Indicator','Disaggregation','Baseline','Target','Current Achievement','Unit','Status']);$('gender').innerHTML=tab(d.gender,['Date','Issue/Barrier','Affected Group','Impact','Root Cause','Recommended Action','Owner','Status']);$('dis').innerHTML=tab(d.disability,['Date','Barrier Type','Affected Group','Accessibility Need','Accommodation/Adjustment','Provided','Cost','Status']);$('part').innerHTML=tab(d.participation,['Date','Activity','Target Group','Invited','Participated','Decision Making','Leadership','Participation Rate','Equity Gap','Status']);$('safe').innerHTML=tab(d.safeguarding,['Date','Activity ID','Inclusion Standard','Result','Barrier/Risk','Corrective Action','Status']);$('actions').innerHTML=tab(d.actions,['Date','Inclusion Area','Issue','Action','Owner','Due Date','Status']);$('complaints').innerHTML=tab(d.complaints,['Date','Channel','Inclusion Category','Anonymous','Risk Level','Action Required','Owner','Status','Response Date']);$('alerts').innerHTML=tab(d.alerts,['Alert Type','Severity','Message','Status','Due Date','Assigned To']);}catch(e){$('cards').innerHTML='<div class="card">'+esc(e.message)+'</div>'}}load();</script></body></html>
