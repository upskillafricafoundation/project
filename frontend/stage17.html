<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UAF M&E/L — Stage 17</title><script src="config.js"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{padding:22px;background:#fff;border-bottom:1px solid #ddd}main{max-width:1200px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px}.card{background:#fff;border:1px solid #e2e6ee;border-radius:12px;padding:18px}.num{font-size:26px;font-weight:700;margin-top:8px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{padding:10px 14px;border:1px solid #ccd3df;background:#fff;border-radius:8px}.panel{display:none;background:#fff;border:1px solid #e2e6ee;border-radius:12px;padding:18px}.panel.active{display:block}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}small{color:#667085}</style></head><body><header><main><h1>Stage 17 — Sustainability, Exit & Resilience</h1><small>Ownership → Capacity → Resources → Systems → Continuity → Exit</small></main></header><main><div class="grid" id="cards"></div><div class="tabs"><button onclick="show('plans')">Sustainability Plans</button><button onclick="show('exit')">Exit Plans</button><button onclick="show('ownership')">Local Ownership</button><button onclick="show('capacity')">Capacity Transfer</button><button onclick="show('funding')">Funding</button><button onclick="show('risks')">Resilience Risks</button><button onclick="show('continuity')">Continuity</button><button onclick="show('commitments')">Commitments</button><button onclick="show('alerts')">Alerts</button></div><div id="plans" class="panel active"></div><div id="exit" class="panel"></div><div id="ownership" class="panel"></div><div id="capacity" class="panel"></div><div id="funding" class="panel"></div><div id="risks" class="panel"></div><div id="continuity" class="panel"></div><div id="commitments" class="panel"></div><div id="alerts" class="panel"></div></main><script>const esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function api(a){return (await fetch(API_URL+'?action='+encodeURIComponent(a))).json()}function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}function table(rows,cols){if(!rows||!rows.length)return '<p>No records.</p>';return '<table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,100).map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}async function load(){try{const x=await api('sustainabilityDashboard');if(!x.ok)throw Error(x.error);const d=x.data,s=d.summary;document.getElementById('cards').innerHTML=[['Sustainability Plans',s.sustainabilityPlans],['Active Plans',s.activePlans],['Exit Readiness',s.exitReadiness+'%'],['Local Ownership',s.ownershipScore+'%'],['Capacity Transfer',s.capacityScore+'%'],['Resources Mobilized',s.resourcesMobilized],['Open Resilience Risks',s.openRisks],['Resilience Score',s.resilienceScore+'%'],['Continuity Plans',s.continuityPlans],['Overdue Commitments',s.overdueCommitments],['Open Alerts',s.openAlerts]].map(x=>'<div class="card"><small>'+x[0]+'</small><div class="num">'+esc(x[1])+'</div></div>').join('');document.getElementById('plans').innerHTML=table(d.sustainabilityPlans,['Sustainability Area','Objective','Strategy','Owner','Target','Actual','Status']);document.getElementById('exit').innerHTML=table(d.exitPlans,['Exit Strategy','Exit Criteria','Responsible Person','Exit Date','Status','Readiness %']);document.getElementById('ownership').innerHTML=table(d.ownership,['Community','Stakeholder','Role','Capacity Level','Decision Making Level','Ownership Score','Status']);document.getElementById('capacity').innerHTML=table(d.capacityTransfers,['Recipient','Organization/Group','Capacity Area','Baseline Capacity','Target Capacity','Current Capacity','Status','Follow-up Date']);document.getElementById('funding').innerHTML=table(d.funding,['Funding Source','Funding Type','Amount','Currency','Start Date','End Date','Status','Probability']);document.getElementById('risks').innerHTML=table(d.risks,['Risk Category','Risk','Likelihood','Impact','Score','Mitigation','Contingency Plan','Status']);document.getElementById('continuity').innerHTML=table(d.continuity,['Risk/Event','Critical Function','Response Action','Responsible Person','Backup Person','Recovery Target','Status','Last Tested']);document.getElementById('commitments').innerHTML=table(d.commitments,['Stakeholder','Commitment','Due Date','Status','Completion Date','Owner']);document.getElementById('alerts').innerHTML=table(d.alerts,['Alert Type','Severity','Message','Status','Due Date','Assigned To']);}catch(e){document.getElementById('cards').innerHTML='<div class="card">API connection error: '+esc(e.message)+'</div>'}}load();</script></body></html>
