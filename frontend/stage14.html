<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UAF Stage 14</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#172033}.wrap{max-width:1250px;margin:auto;padding:24px}.hero{background:white;border-radius:16px;padding:24px;margin-bottom:18px;box-shadow:0 3px 15px #00000012}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:white;padding:18px;border-radius:14px;box-shadow:0 2px 10px #0000000d}.num{font-size:28px;font-weight:700;margin-top:8px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button{border:0;padding:11px 15px;border-radius:9px;background:#e9edf3;cursor:pointer}.tabs button.active{background:#173b70;color:white}.panel{background:white;border-radius:14px;padding:20px;overflow:auto}.hidden{display:none}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e5e8ed;text-align:left}th{background:#f1f4f8}select,input,textarea{padding:10px;border:1px solid #ccd3dd;border-radius:8px;margin:4px;width:calc(100% - 8px)}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:5px;margin-bottom:20px}.full{grid-column:1/-1}button.primary{background:#c62828;color:white;border:0;padding:11px 16px;border-radius:8px;cursor:pointer}.muted{color:#667085}.ok{color:#18794e}.warn{color:#b54708}</style></head><body><div class="wrap"><div class="hero"><h1>Communications, Advocacy & Stakeholder Engagement M&E</h1><p class="muted">Stage 14 — measure stakeholder relationships, advocacy actions, campaign reach, communications, outreach and commitments across all UAF projects.</p><label>Project <select id="project"><option value="">All accessible projects</option></select></label><button class="primary" onclick="load()">Refresh</button></div><div id="cards" class="grid"></div><div class="tabs" id="tabs"></div><div id="panel" class="panel"></div></div><script src="config.js"></script><script>let D={};const tabs=[['overview','Overview'],['stakeholders','Stakeholders'],['engagements','Engagements'],['campaigns','Campaigns'],['advocacy','Advocacy'],['communications','Communications'],['outreach','Outreach'],['commitments','Commitments'],['alerts','Alerts']];let current='overview';tabs.forEach(t=>{let b=document.createElement('button');b.textContent=t[1];b.onclick=()=>show(t[0],b);document.getElementById('tabs').appendChild(b)});function api(a){return fetch(API_URL+'?action='+a+'&projectId='+encodeURIComponent(document.getElementById('project').value)).then(r=>r.json())}async function load(){let r=await api('communicationsDashboard');if(!r.ok)return alert(r.error);D=r.data;renderCards();show(current)}function renderCards(){let s=D.summary||{};let items=[['Stakeholders',s.stakeholders],['Engagements',s.engagements],['Active Campaigns',s.activeCampaigns],['Advocacy Actions',s.advocacyActions],['Verified Advocacy Outcomes',s.verifiedAdvocacyOutcomes],['Total Reach',s.totalReach],['Outreach Participants',s.outreachParticipants],['Commitments',s.commitments],['Completed Commitments',s.completedCommitments],['Overdue Commitments',s.overdueCommitments],['Open Alerts',s.openAlerts]];document.getElementById('cards').innerHTML=items.map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="num">'+(x[1]??0)+'</div></div>').join('')}function esc(x){return String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function table(rows){if(!rows||!rows.length)return '<p class="muted">No records available.</p>';let keys=Object.keys(rows[0]);return '<table><thead><tr>'+keys.map(k=>'<th>'+esc(k)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+keys.map(k=>'<td>'+esc(r[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}function show(name,btn){current=name;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');let p=document.getElementById('panel');let map={overview:['Overview',D.engagements],stakeholders:['Stakeholder Register',D.stakeholders],engagements:['Engagement Register',D.engagements],campaigns:['Campaign Register',D.campaigns],advocacy:['Advocacy Actions',D.advocacy],communications:['Communications',D.communications],outreach:['Outreach Events',D.outreach],commitments:['Stakeholder Commitments',D.commitments],alerts:['Open Communications Alerts',D.alerts]};let x=map[name]||map.overview;p.innerHTML='<h2>'+x[0]+'</h2>'+table(x[1])}load();</script></body></html>
