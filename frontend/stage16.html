<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UAF M&E/L — Stage 16</title><script src="config.js"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{padding:22px;background:#fff;border-bottom:1px solid #ddd}main{max-width:1200px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.card{background:#fff;border:1px solid #e2e6ee;border-radius:12px;padding:18px}.num{font-size:28px;font-weight:700;margin-top:8px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{padding:10px 14px;border:1px solid #ccd3df;background:#fff;border-radius:8px;cursor:pointer}.panel{display:none;background:#fff;border:1px solid #e2e6ee;border-radius:12px;padding:18px}.panel.active{display:block}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}small{color:#667085}</style></head><body><header><main><h1>Stage 16 — Knowledge & Organizational Learning</h1><small>Capture → Organize → Share → Use → Improve</small></main></header><main><div class="grid" id="cards"></div><div class="tabs"><button onclick="show('knowledge')">Knowledge Assets</button><button onclick="show('questions')">Learning Questions</button><button onclick="show('lessons')">Lessons Learned</button><button onclick="show('adaptations')">Adaptations</button><button onclick="show('practices')">Good Practices</button><button onclick="show('improvements')">Improvements</button><button onclick="show('decisions')">Decisions</button><button onclick="show('alerts')">Alerts</button></div><div id="knowledge" class="panel active"></div><div id="questions" class="panel"></div><div id="lessons" class="panel"></div><div id="adaptations" class="panel"></div><div id="practices" class="panel"></div><div id="improvements" class="panel"></div><div id="decisions" class="panel"></div><div id="alerts" class="panel"></div></main><script>const esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function api(a){const r=await fetch(API_URL+'?action='+encodeURIComponent(a));return r.json()}function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}function table(rows,cols){if(!rows||!rows.length)return '<p>No records.</p>';return '<table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,100).map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}async function load(){try{const x=await api('knowledgeDashboard');if(!x.ok)throw Error(x.error);const d=x.data,s=d.summary;document.getElementById('cards').innerHTML=[['Knowledge Assets',s.knowledgeAssets],['Open Questions',s.openLearningQuestions],['Sessions',s.learningSessions],['Lessons',s.lessonsLearned],['Adaptations',s.adaptationsCompleted+'/'+s.adaptations],['Good Practices',s.goodPractices],['Knowledge Products',s.knowledgeProducts],['Improvements',s.improvementActionsCompleted+'/'+s.improvementActions],['Decisions',s.decisions],['Overdue Actions',s.overdueActions],['Open Alerts',s.openAlerts]].map(x=>'<div class="card"><small>'+x[0]+'</small><div class="num">'+esc(x[1])+'</div></div>').join('');document.getElementById('knowledge').innerHTML=table(d.knowledgeAssets,['Asset Type','Title','Topic','Author','Status']);document.getElementById('questions').innerHTML=table(d.learningQuestions,['Question','Why It Matters','Owner','Review Date','Status','Answer']);document.getElementById('lessons').innerHTML=table(d.lessons,['Date','Theme','Lesson','What Worked','What Did Not Work','Recommendation']);document.getElementById('adaptations').innerHTML=table(d.adaptations,['Date','Problem','Adaptation','Expected Result','Actual Result','Decision','Status']);document.getElementById('practices').innerHTML=table(d.goodPractices,['Date','Practice','Why It Works','Applicable Context','Replicable','Status']);document.getElementById('improvements').innerHTML=table(d.improvements,['Date','Improvement Area','Issue','Root Cause','Action','Owner','Due Date','Status']);document.getElementById('decisions').innerHTML=table(d.decisions,['Date','Decision','Evidence','Reason','Responsible Person','Due Date','Status','Outcome']);document.getElementById('alerts').innerHTML=table(d.alerts,['Alert Type','Severity','Message','Status','Due Date','Assigned To']);}catch(e){document.getElementById('cards').innerHTML='<div class="card">API connection error: '+esc(e.message)+'</div>'}}load();</script></body></html>
