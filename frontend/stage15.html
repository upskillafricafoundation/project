<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UAF Stage 15 — Partnerships</title><style>body{font-family:Inter,Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#fff;padding:22px 28px;border-bottom:1px solid #e5e9f2}h1{margin:0 0 5px}main{padding:24px;max-width:1400px;margin:auto}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.bar select,.bar button{padding:10px 13px;border:1px solid #d8deea;border-radius:8px;background:#fff}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{background:#fff;border:1px solid #e4e8f0;border-radius:12px;padding:16px}.n{font-size:26px;font-weight:700;margin-top:6px}.tabs{display:flex;gap:8px;overflow:auto;margin:22px 0 12px}.tabs button{border:0;background:#e9edf5;padding:10px 14px;border-radius:8px;cursor:pointer}.tabs button.active{background:#172033;color:#fff}.panel{display:none;background:#fff;border:1px solid #e4e8f0;border-radius:12px;padding:18px}.panel.active{display:block}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf0f5;white-space:nowrap}th{background:#f8f9fc}.muted{color:#657086}.error{color:#a22;margin:10px 0}</style></head><body><header><h1>Partnership, Network & Collaboration M&E</h1><div class="muted">Stage 15 — partner performance, MOUs, contributions, referrals, commitments, risks and joint initiatives</div></header><main><div class="bar"><select id="project"><option value="">All accessible projects</option></select><button onclick="load()">Refresh</button><button onclick="alerts()">Generate Alerts</button></div><div id="err" class="error"></div><section id="cards" class="cards"></section><div class="tabs"><button class="active" onclick="tab('overview',this)">Overview</button><button onclick="tab('partners',this)">Partners</button><button onclick="tab('mous',this)">MOUs</button><button onclick="tab('activities',this)">Activities</button><button onclick="tab('contributions',this)">Contributions</button><button onclick="tab('referrals',this)">Referrals</button><button onclick="tab('commitments',this)">Commitments</button><button onclick="tab('performance',this)">Performance</button><button onclick="tab('initiatives',this)">Joint Initiatives</button><button onclick="tab('risks',this)">Risks & Alerts</button></div><div id="overview" class="panel active"><p>Use the project selector to focus the dashboard. Alerts cover overdue partner commitments, MOUs expiring within 30 days, and high partnership risks.</p></div><div id="partners" class="panel"></div><div id="mous" class="panel"></div><div id="activities" class="panel"></div><div id="contributions" class="panel"></div><div id="referrals" class="panel"></div><div id="commitments" class="panel"></div><div id="performance" class="panel"></div><div id="initiatives" class="panel"></div><div id="risks" class="panel"></div></main><script src="config.js"></script><script>let D={};const esc=x=>String(x??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));async function api(a){let p=document.getElementById('project').value,u=API_URL+'?action='+encodeURIComponent(a)+(p?'&projectId='+encodeURIComponent(p):'');let r=await fetch(u);return r.json()}function tab(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function table(id,rows,cols){document.getElementById(id).innerHTML='<div class="tablewrap"><table><thead><tr>'+cols.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}async function load(){try{document.getElementById('err').textContent='';let x=await api('partnershipDashboard');if(!x.ok)throw Error(x.error);D=x.data;let s=D.summary;let cards={Partners:s.partners,'Active Partnerships':s.activePartnerships,'Active MOUs':s.activeMOUs,'MOUs Expiring ≤30d':s.mousExpiring30,'Contributions':s.contributions,'Cash Value':s.cashContributions,'In-Kind Value':s.inKindContributions,'Referrals':s.referrals,'Commitments':s.commitments,'Overdue Commitments':s.overdueCommitments,'Partner Reviews':s.performanceReviews,'Avg Rating':s.averagePartnerRating,'Joint Initiatives':s.jointInitiatives,'Open Risks':s.openRisks,'Open Alerts':s.openAlerts};document.getElementById('cards').innerHTML=Object.entries(cards).map(([k,v])=>'<div class="card"><div class="muted">'+esc(k)+'</div><div class="n">'+esc(v)+'</div></div>').join('');table('partners',D.partners,['Organization','Partner Type','County','Sector','Partnership Status','Relationship Health','Capacity Needs']);table('mous',D.mous,['MOU Title','Partner ID','Project ID','Start Date','End Date','Status','Review Date']);table('activities',D.activities,['Date','Partner ID','Project ID','Activity','Role of Partner','Output','Outcome','Status']);table('contributions',D.contributions,['Date','Partner ID','Project ID','Contribution Type','Description','Cash Value','In-Kind Value','Currency','Verified','Status']);table('referrals',D.referrals,['Date','Partner ID','Project ID','Beneficiary ID','Referral Type','Service Referred','Outcome','Follow-up Date','Status']);table('commitments',D.commitments,['Date','Partner ID','Project ID','Commitment','Responsible Person','Due Date','Status','Completion Date']);table('performance',D.performance,['Review Period','Partner ID','Project ID','Achievement','Collaboration Rating','Responsiveness Rating','Quality Rating','Overall Rating','Recommendation']);table('initiatives',D.jointInitiatives,['Initiative Name','Partner ID','Project ID','Start Date','End Date','Target','Achievement','Outcome','Status']);table('risks',D.risks,['Date','Partner ID','Project ID','Risk','Likelihood','Impact','Score','Mitigation','Status']);}catch(e){document.getElementById('err').textContent=e.message}}async function alerts(){try{let x=await fetch(API_URL+'?action=partnershipDashboard'+(document.getElementById('project').value?'&projectId='+encodeURIComponent(document.getElementById('project').value):''));if(!x.ok)throw Error('Dashboard request failed');let p=document.getElementById('project').value;let r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'generatePartnershipAlerts',projectId:p})});let j=await r.json();if(!j.ok)throw Error(j.error);alert('Alerts created: '+j.created);load()}catch(e){document.getElementById('err').textContent=e.message}}load();</script></body></html>
