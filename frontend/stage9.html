<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UAF M&E/L · Advanced Analytics</title><script src="config.js"></script><style>body{font-family:Arial;margin:0;background:#f4f6f9;color:#172033}header{background:#123b8e;color:#fff;padding:20px 24px}main{max-width:1300px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 8px #0001;margin-bottom:16px}.num{font-size:30px;font-weight:700}.muted{color:#687386}.pill{display:inline-block;padding:5px 9px;border-radius:12px;background:#eef2f7;font-size:12px;margin:2px}.critical{border-left:5px solid #b00020}.high{border-left:5px solid #d72638}.medium{border-left:5px solid #d98b00}button{border:0;border-radius:7px;padding:10px 14px;background:#123b8e;color:white;cursor:pointer;margin-right:6px}.bar{height:10px;background:#e6e9ef;border-radius:8px;overflow:hidden}.fill{height:100%;background:#d72638}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #eee;font-size:13px}select{padding:10px;border:1px solid #ccd2dc;border-radius:7px}.hidden{display:none}</style></head><body><header><b>Upskill Africa Foundation</b><div>Stage 9 · Advanced Analytics & Decision Support</div></header><main><div class="card"><select id="project"><option value="">All accessible projects</option></select> <button onclick="load()">Refresh Analytics</button> <button onclick="location.href='index.html'">Main M&E/L</button></div><div class="grid"><div class="card">Projects<div class="num" id="projects">0</div></div><div class="card">Beneficiaries<div class="num" id="beneficiaries">0</div></div><div class="card">Decision Signals<div class="num" id="signals">0</div></div><div class="card">Critical Signals<div class="num" id="critical">0</div></div><div class="card">Red Forecasts<div class="num" id="red">0</div></div></div><div class="card"><h2>Portfolio Performance</h2><div id="portfolio"></div></div><div class="card"><h2>Early-Warning Decision Signals</h2><div id="signalList"></div></div><div class="card"><h2>KPI Forecasts</h2><div id="forecasts"></div></div><div class="grid"><div class="card"><h2>Sex</h2><div id="sex"></div></div><div class="card"><h2>County</h2><div id="county"></div></div><div class="card"><h2>Age Bands</h2><div id="age"></div></div></div><div class="card"><h2>Indicator Trend Data</h2><div id="trends"></div></div></main><script>const $=id=>document.getElementById(id);async function api(q,o){if(!API_URL||API_URL==='YOUR_APPS_SCRIPT_EXEC_URL')throw Error('Set the Apps Script /exec URL in frontend/config.js.');return(await fetch(API_URL+q,o)).json()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function list(o){return Object.entries(o||{}).map(x=>'<span class="pill">'+esc(x[0])+': '+x[1]+'</span>').join('')||'No data.'}async function loadProjects(){try{let r=await api('?action=list&sheet=Projects');$('project').innerHTML='<option value="">All accessible projects</option>'+(r.data||[]).map(x=>'<option value="'+esc(x['Project ID'])+'">'+esc(x['Project Name'])+'</option>').join('')}catch(e){}}async function load(){try{let p=$('project').value;let d=await api('?action=stage9'+(p?'&projectId='+encodeURIComponent(p):''));$('projects').textContent=d.summary.projects;$('beneficiaries').textContent=d.summary.beneficiaries;$('signals').textContent=d.summary.signals;$('critical').textContent=d.summary.criticalSignals;$('red').textContent=d.summary.forecastRed;$('portfolio').innerHTML='<div style="overflow:auto"><table><tr><th>Project</th><th>Beneficiaries</th><th>Completed</th><th>Retention</th><th>KPI On Track</th><th>Overdue Follow-ups</th><th>Quality</th></tr>'+(d.portfolio||[]).map(x=>'<tr><td>'+esc(x['Project Name'])+'</td><td>'+x.Beneficiaries+'</td><td>'+x.Completed+'</td><td>'+x.RetentionRate+'%</td><td>'+x.KPIOnTrackRate+'%</td><td>'+x.OverdueFollowUps+'</td><td>'+((x.QualityScore??'—')+(x.QualityScore===null?'':'%'))+'</td></tr>').join('')+'</table></div>';$('signalList').innerHTML=(d.signals||[]).map(x=>'<div class="card '+String(x.Severity).toLowerCase()+'"><b>'+esc(x.SignalType)+'</b> · <span class="pill">'+esc(x.Severity)+'</span><br>'+esc(x.Message)+'<br><small><b>Recommended action:</b> '+esc(x.RecommendedAction)+'</small></div>').join('')||'No active decision signals.';$('forecasts').innerHTML='<div style="overflow:auto"><table><tr><th>Indicator</th><th>Current</th><th>Target</th><th>Projected</th><th>Projected %</th><th>RAG</th></tr>'+(d.forecasts||[]).map(x=>'<tr><td>'+esc(x.Indicator)+'</td><td>'+x.CurrentAchievement+'</td><td>'+x.Target+'</td><td>'+x.ProjectedAchievement+'</td><td>'+x.ProjectedPercent+'%</td><td><span class="pill">'+x.ForecastRAG+'</span></td></tr>').join('')+'</table></div>';$('sex').innerHTML=list(d.disaggregation.sex);$('county').innerHTML=list(d.disaggregation.county);$('age').innerHTML=list(d.disaggregation.ageBands);$('trends').innerHTML='<div style="overflow:auto"><table><tr><th>Indicator ID</th><th>Period</th><th>Achievement</th></tr>'+(d.trends||[]).map(x=>'<tr><td>'+esc(x.IndicatorID)+'</td><td>'+esc(x.Period)+'</td><td>'+x.Achievement+'</td></tr>').join('')+'</table></div>'}catch(e){alert(e.message)}}loadProjects().then(load)</script></body></html>
