<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UAF Stage 13 — HR & Workplans</title><style>:root{--r:#b91c1c;--b:#1d4ed8;--ink:#172033;--muted:#64748b;--bg:#f5f7fb;--card:#fff}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,var(--b),var(--r));color:#fff;padding:24px}header h1{margin:0 0 6px;font-size:24px}header p{margin:0;opacity:.9}.wrap{max-width:1400px;margin:auto;padding:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar select,.toolbar button,form input,form select,form textarea{padding:10px;border:1px solid #d7dce5;border-radius:8px;background:#fff}button{cursor:pointer;border:0;background:var(--b);color:#fff;padding:10px 14px;border-radius:8px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}.card{background:var(--card);border:1px solid #e5e7eb;border-radius:12px;padding:16px}.card small{display:block;color:var(--muted)}.card strong{display:block;font-size:25px;margin-top:7px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tabs button{background:#e8edf7;color:var(--ink)}.tabs button.active{background:var(--b);color:#fff}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:16px}.panel h2{font-size:18px;margin-top:0}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #edf0f4;vertical-align:top}th{background:#f8fafc}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}textarea{min-height:80px}.full{grid-column:1/-1}.status{padding:3px 7px;border-radius:99px;background:#eef2ff}.empty{color:var(--muted);padding:15px}.notice{padding:10px;border-radius:8px;background:#eff6ff;margin-bottom:12px}</style></head><body><header><div class="wrap"><h1>Stage 13 — HR, Staff, Volunteer & Workplan Management M&E</h1><p>Manage personnel, workload, attendance, timesheets, training, performance, leave, workplans and field deployments across all UAF projects.</p></div></header><main class="wrap"><div class="toolbar"><select id="project"><option value="">All accessible projects</option></select><button onclick="loadDash()">Refresh Dashboard</button><button onclick="generateAlerts()">Generate HR Alerts</button></div><div id="cards" class="cards"></div><div class="tabs" id="tabs"></div><section id="content"></section></main><script src="config.js"></script><script>const API=typeof API_URL==='string'?API_URL:'';let tab='dashboard',dash=null;const tabs=[['dashboard','Dashboard'],['staff','Staff'],['volunteers','Volunteers'],['assignments','Assignments'],['attendance','Attendance'],['timesheets','Timesheets'],['training','Training'],['performance','Performance'],['leave','Leave'],['workplans','Workplans'],['fieldDeployments','Field Deployments'],['hrAlerts','Alerts']];function esc(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}function q(){return document.getElementById('project').value}async function get(a){let u=API+'?action='+encodeURIComponent(a)+(q()?'&projectId='+encodeURIComponent(q()):'');let r=await fetch(u);return r.json()}async function post(body){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json()}function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(x=>`<button class="${tab===x[0]?'active':''}" onclick="show('${x[0]}')">${x[1]}</button>`).join('')}function cards(s){let a=[['Active Staff',s.activeStaff],['Volunteers',s.activeVolunteers],['Active Assignments',s.activeAssignments],['Attendance Rate',s.attendanceRate+'%'],['Approved Hours',s.timesheetHours],['Training Records',s.trainingRecords],['Workplan Completion',s.workplanCompletionRate+'%'],['Field Deployments',s.fieldDeployments],['Open HR Alerts',s.openAlerts],['Contracts ≤30 Days',s.contractsExpiring30Days]];document.getElementById('cards').innerHTML=a.map(x=>`<div class="card"><small>${x[0]}</small><strong>${esc(x[1])}</strong></div>`).join('')}function table(rows){if(!rows||!rows.length)return '<div class="empty">No records found.</div>';let keys=Object.keys(rows[0]);return '<div style="overflow:auto"><table><thead><tr>'+keys.map(k=>`<th>${esc(k)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+keys.map(k=>`<td>${esc(r[k])}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>'}async function loadDash(){try{let r=await get('hrDashboard');if(!r.ok)throw Error(r.error);dash=r.data;cards(dash.summary);if(tab==='dashboard')renderDashboard()}catch(e){document.getElementById('content').innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}function renderDashboard(){document.getElementById('content').innerHTML='<div class="panel"><h2>Personnel Allocation</h2>'+table(dash.allocation)+'</div><div class="panel"><h2>Workplans</h2>'+table(dash.workplans)+'</div><div class="panel"><h2>Field Deployments</h2>'+table(dash.deployments)+'</div><div class="panel"><h2>HR Alerts</h2>'+table(dash.alerts)+'</div>'}async function show(t){tab=t;renderTabs();if(t==='dashboard'){if(!dash)await loadDash();else renderDashboard();return}let r=await get(t);if(!r.ok){document.getElementById('content').innerHTML='<div class="notice">'+esc(r.error)+'</div>';return}document.getElementById('content').innerHTML='<div class="panel"><h2>'+esc(t.replace(/([A-Z])/g,' $1'))+'</h2>'+table(r.data)+'</div>';if(['staff','volunteers','assignments','attendance','timesheets','training','performance','leave','workplans','fieldDeployments'].includes(t))document.getElementById('content').insertAdjacentHTML('afterbegin',formFor(t))}function formFor(t){let entityMap={staff:'staff',volunteers:'volunteer',assignments:'assignment',attendance:'attendance',timesheets:'timesheet',training:'training',performance:'performance',leave:'leave',workplans:'workplan',fieldDeployments:'fieldDeployment'};let fields={staff:['Name','Email','Phone','Role','Department/Unit','Employment Type','Start Date','End Date','County','Status','Supervisor','Skills','Project Access'],volunteers:['Name','Email','Phone','Role','Community','Start Date','End Date','Status','Supervisor','Skills','Project Access'],assignments:['Project ID','Staff/Volunteer ID','Person Type','Activity ID','Role','Start Date','End Date','Allocation %','Status'],attendance:['Person ID','Person Type','Date','Check In','Check Out','Status','Location','Project ID','Activity ID','Notes'],timesheets:['Person ID','Person Type','Project ID','Activity ID','Date','Hours','Work Description','Status','Approved By'],training:['Person ID','Person Type','Project ID','Training Title','Date','Provider','Hours','Cost','Skills/Competency','Outcome','Evidence URL'],performance:['Person ID','Person Type','Review Period','Objectives','Achievement','Strengths','Development Needs','Rating','Reviewer','Review Date'],leave:['Person ID','Person Type','Leave Type','Start Date','End Date','Days','Reason','Status','Approved By'],workplans:['Person ID','Person Type','Project ID','Period Start','Period End','Objective/Activity','Planned Output','Target','Actual','Status','Notes'],fieldDeployments:['Person ID','Person Type','Project ID','Community','Date','Activity','Purpose','Start Time','End Time','Transport/Per Diem Cost','Evidence URL','Status']};return `<div class="panel"><h2>Record ${esc(t)}</h2><form id="recordForm">${fields[t].map(f=>`<input name="${esc(f)}" placeholder="${esc(f)}">`).join('')}<button type="submit">Save Record</button></form></div><script>document.getElementById('recordForm').onsubmit=async e=>{e.preventDefault();let o={};new FormData(e.target).forEach((v,k)=>o[k]=v);let r=await post({action:'createStage13Record',entity:'${entityMap[t]}',data:o});alert(r.ok?'Saved successfully':r.error);if(r.ok)show('${t}')};<\/script>`}async function generateAlerts(){let r=await post({action:'generateHRAlerts',projectId:q()});alert(r.ok?'Created '+r.created+' alert(s)':r.error);loadDash()}document.getElementById('project').onchange=loadDash;renderTabs();loadDash();</script></body></html>
