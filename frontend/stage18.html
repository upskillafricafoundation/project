<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UAF M&E/L — Stage 18</title><script src="config.js"></script><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{background:#123b8e;color:#fff;padding:22px}main{max-width:1200px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.card,.panel{background:#fff;border:1px solid #e1e6ee;border-radius:12px;padding:18px}.num{font-size:27px;font-weight:700;margin-top:8px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{padding:10px 13px;border:1px solid #ccd3df;border-radius:8px;background:#fff}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}.panel{display:none}.panel.active{display:block}small{color:#667085}</style></head><body><header><main><h1>Stage 18 — Safeguarding & Child Protection</h1><small>Safeguarding • Child Protection • PSEA • Accountability • Do-No-Harm</small></main></header><main><div id="cards" class="grid"></div><div class="tabs"><button onclick="show('cases')">Protection Cases</button><button onclick="show('referrals')">Referrals</button><button onclick="show('psea')">PSEA</button><button onclick="show('feedback')">Feedback & Complaints</button><button onclick="show('consent')">Consent</button><button onclick="show('risks')">Safeguarding Risks</button><button onclick="show('safe')">Safe Programming</button><button onclick="show('training')">Training</button><button onclick="show('alerts')">Alerts</button></div><div id="cases" class="panel active"></div><div id="referrals" class="panel"></div><div id="psea" class="panel"></div><div id="feedback" class="panel"></div><div id="consent" class="panel"></div><div id="risks" class="panel"></div><div id="safe" class="panel"></div><div id="training" class="panel"></div><div id="alerts" class="panel"></div></main><script>const esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}async function load(){try{if(!API_URL||API_URL==='YOUR_APPS_SCRIPT_EXEC_URL')throw Error('Set the Apps Script /exec URL in frontend/config.js.');let r=await fetch(API_URL+'?action=safeguardingDashboard'),x=await r.json();if(!x.ok)throw Error(x.error);let d=x.data,s=d.summary;let cards=[['Protection Cases',s.protectionCases],['Open Cases',s.openCases],['High Risks',s.highRisks],['Open Referrals',s.openReferrals],['PSEA Reports',s.pseaReports],['Open PSEA',s.openPSEA],['Open Complaints',s.openComplaints],['Consent Records',s.consentRecords],['Safe Programming',s.safeguardingCompliance+'%'],['Incidents',s.incidents],['Open Alerts',s.openAlerts]];$('cards').innerHTML=cards.map(x=>'<div class="card"><small>'+x[0]+'</small><div class="num">'+esc(x[1])+'</div></div>').join('');$('cases').innerHTML=tab(d.cases,['Case ID','Date Reported','Incident Category','Risk Level','Referral Required','Referral Status','Assigned Officer','Case Status']);$('referrals').innerHTML=tab(d.referrals,['Referral ID','Case ID','Service Type','Provider','Consent Status','Referral Status','Follow-up Date','Outcome']);$('psea').innerHTML=tab(d.psea,['PSEA Report ID','Date Reported','Report Type','Risk Level','Reporting Channel','Confidentiality Level','Status','Assigned Officer']);$('feedback').innerHTML=tab(d.feedback,['Feedback ID','Date','Channel','Category','Anonymous','Risk Level','Action Required','Status','Response Date']);$('consent').innerHTML=tab(d.consent,['Consent ID','Beneficiary ID','Consent Type','Consent Given','Assent Required','Assent Given','Data Use Permission','Photo/Media Permission']);$('risks').innerHTML=tab(d.risks,['Risk Category','Risk','Affected Group','Likelihood','Impact','Score','Mitigation','Status']);$('safe').innerHTML=tab(d.safeProgramming,['Check ID','Activity ID','Date','Safeguarding Check','Standard','Result','Corrective Action','Status']);$('training').innerHTML=tab(d.training,['Training ID','Date','Training Type','Participants','Topics','Completion Status']);$('alerts').innerHTML=tab(d.alerts,['Alert Type','Severity','Message','Status','Due Date','Assigned To']);}catch(e){$('cards').innerHTML='<div class="card">'+esc(e.message)+'</div>'}}function $(x){return document.getElementById(x)}function tab(rows,cols){if(!rows||!rows.length)return'<p>No records.</p>';return'<div style="overflow:auto"><table><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>'+rows.slice(0,100).map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join('')+'</tr>').join('')+'</table></div>'}load();</script></body></html>
