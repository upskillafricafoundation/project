name: Finalize Apps Script Consolidation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add remaining Apps Script modules
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'function stage9GetAction_' apps-script/Code.gs; then
            printf '\n\n/************************************************************\n * SOURCE: apps-script/Stage9.gs\n ************************************************************/\n' >> apps-script/Code.gs
            cat apps-script/Stage9.gs >> apps-script/Code.gs
          fi
          if ! grep -q 'Stage 8 Quality Refinement' apps-script/Code.gs && [ -f apps-script/Stage8QualityRefinement.gs ]; then
            printf '\n\n/************************************************************\n * SOURCE: apps-script/Stage8QualityRefinement.gs\n ************************************************************/\n' >> apps-script/Code.gs
            cat apps-script/Stage8QualityRefinement.gs >> apps-script/Code.gs
          fi

      - name: Validate consolidated source
        shell: bash
        run: |
          cp apps-script/Code.gs /tmp/Code.js
          node --check /tmp/Code.js

      - name: Remove remaining split sources and temporary consolidation workflows
        shell: bash
        run: |
          rm -f apps-script/Stage9.gs apps-script/Stage8QualityRefinement.gs
          rm -f .github/workflows/consolidate-apps-script.yml .github/workflows/finalize-apps-script.yml

      - name: Commit final single-file Apps Script
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script .github/workflows
          git commit -m 'Finalize single-file Apps Script [skip ci]' || exit 0
          git push
