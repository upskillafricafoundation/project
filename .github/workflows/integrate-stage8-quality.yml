name: Integrate Stage 8 Quality Scoring

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire refined score endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps-script/Stage8.gs')
          s=p.read_text(encoding='utf-8')
          marker='UAF_STAGE8_REFINED_SCORE'
          if marker not in s:
              old="function stage8PostAction_(a){return ['stage8Setup','createStage8Record','calculateQualityScore'].indexOf(a)>=0;}"
              new=old+"\n// UAF_STAGE8_REFINED_SCORE\nfunction stage8RefinedScoreAction_(a){return a==='calculateRefinedQualityScore';}"
              if old not in s: raise SystemExit('Stage8 POST action anchor not found')
              s=s.replace(old,new,1)
              old2="function stage8Post_(a,d){if(a==='stage8Setup'){permission_('update');return json_({ok:true,message:setupStage8()});}if(a==='calculateQualityScore'){permission_('report',d.projectId||'');return json_({ok:true,data:stage8CalculateScore_(d.projectId||'',d.period||'')});}permission_('create',d.data&&d.data['Project ID']);return createStage8Record_(d.entity,d.data);}"
              new2=old2+"\nfunction stage8RefinedScorePost_(d){permission_('report',d.projectId||'');return json_({ok:true,data:calculateRefinedQualityScore_(d.projectId||'',d.period||'')});}"
              if old2 not in s: raise SystemExit('Stage8 POST function anchor not found')
              s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Wire endpoint before normal Stage 8 POST routing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps-script/Stage8.gs')
          s=p.read_text(encoding='utf-8')
          marker='UAF_STAGE8_REFINED_POST_ROUTE'
          if marker not in s:
              anchor="function stage8Post_(a,d){"
              replacement="// UAF_STAGE8_REFINED_POST_ROUTE\nfunction stage8Post_(a,d){if(stage8RefinedScoreAction_(a))return stage8RefinedScorePost_(d);"
              if anchor not in s: raise SystemExit('Stage8 post function anchor missing')
              s=s.replace(anchor,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'UAF_STAGE8_REFINED_SCORE' apps-script/Stage8.gs
          grep -q 'calculateRefinedQualityScore' apps-script/Stage8.gs
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/Stage8.gs
          git diff --cached --quiet || git commit -m 'Wire refined Stage 8 quality score API'
          git push