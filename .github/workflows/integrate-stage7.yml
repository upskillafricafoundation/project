name: Integrate Stage 7 API

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Setup.gs safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps-script/Setup.gs')
          s = p.read_text(encoding='utf-8')
          get_marker = "/* UAF_STAGE7_GET_ROUTING */"
          post_marker = "/* UAF_STAGE7_POST_ROUTING */"
          if get_marker in s and post_marker in s:
              print('Stage 7 routing already integrated.')
              raise SystemExit(0)

          old_get = "if(a==='currentUser')return currentUser_();permission_('read');"
          new_get = "if(a==='currentUser')return currentUser_();/* UAF_STAGE7_GET_ROUTING */if(stage7GetAction_(a))return stage7Get_(a,e);permission_('read');"
          if old_get not in s:
              raise SystemExit('Could not find the expected doGet routing anchor; no changes made.')
          s = s.replace(old_get, new_get, 1)

          old_post = "var d=JSON.parse(e.postData.contents||'{}'),a=d.action||'create';if(a==='currentUser')return currentUser_();"
          new_post = "var d=JSON.parse(e.postData.contents||'{}'),a=d.action||'create';/* UAF_STAGE7_POST_ROUTING */if(stage7PostAction_(a))return stage7Post_(a,d);if(a==='currentUser')return currentUser_();"
          if old_post not in s:
              raise SystemExit('Could not find the expected doPost routing anchor; no changes made.')
          s = s.replace(old_post, new_post, 1)
          p.write_text(s, encoding='utf-8')
          print('Stage 7 API routing integrated successfully.')

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Setup.gs
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
          else
            git commit -m "Integrate Stage 7 API into main M&E endpoint"
            git push
          fi
