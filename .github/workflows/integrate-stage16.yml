name: Integrate Stage 16 Backend
on:
  push:
    paths:
      - 'apps-script/Stage16.gs'
      - '.github/workflows/integrate-stage16.yml'
  workflow_dispatch:
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Setup.gs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps-script/Setup.gs')
          s=p.read_text()
          get="/* UAF_STAGE16_GET_ROUTING */"
          post="/* UAF_STAGE16_POST_ROUTING */"
          if get not in s:
              anchor="if(a==='currentUser')return currentUser_();"
              s=s.replace(anchor,anchor+get+"if(stage16GetAction_(a))return stage16Get_(a,e);",1)
          if post not in s:
              marker="function doPost(e)"
              start=s.index(marker)
              pos=s.index("if(a==='currentUser')return currentUser_();",start)
              s=s[:pos]+post+"if(stage16PostAction_(a))return stage16Post_(a,d);"+s[pos:]
          p.write_text(s)
          if get not in s or post not in s: raise SystemExit('Stage 16 routing markers missing')
          PY
      - name: Commit routing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/Setup.gs
          git diff --cached --quiet || git commit -m 'Integrate Stage 16 backend routing'
          git push