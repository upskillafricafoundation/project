name: Integrate UAF Stage 13
on:
  push:
    paths:
      - 'apps-script/Stage13.gs'
      - 'frontend/stage13.html'
      - '.github/workflows/integrate-stage13.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate Stage 13 routes and setup trigger
        shell: python
        run: |
          from pathlib import Path
          p=Path('apps-script/Setup.gs')
          s=p.read_text()
          changed=False
          if '/* UAF_STAGE12_GET_ROUTING */' not in s:
              anchor="if(a==='currentUser')return currentUser_();"
              s=s.replace(anchor, anchor+"/* UAF_STAGE12_GET_ROUTING */if(stage12GetAction_(a))return stage12Get_(a,e);",1); changed=True
          if '/* UAF_STAGE12_POST_ROUTING */' not in s:
              anchor="if(a==='currentUser')return currentUser_();"
              # place in doPost, not doGet
              idx=s.find('function doPost(e)')
              tail=s[idx:]
              tail=tail.replace(anchor,anchor+"/* UAF_STAGE12_POST_ROUTING */if(stage12PostAction_(a))return stage12Post_(a,d);",1)
              s=s[:idx]+tail; changed=True
          if '/* UAF_STAGE13_GET_ROUTING */' not in s:
              anchor="if(a==='currentUser')return currentUser_();"
              idx=s.find('function doGet(e)'); end=s.find('function currentUser_',idx)
              block=s[idx:end]
              block=block.replace(anchor,anchor+"/* UAF_STAGE13_GET_ROUTING */if(stage13GetAction_(a))return stage13Get_(a,e);",1)
              s=s[:idx]+block+s[end:]; changed=True
          if '/* UAF_STAGE13_POST_ROUTING */' not in s:
              anchor="if(a==='currentUser')return currentUser_();"
              idx=s.find('function doPost(e)'); end=s.find('function create_',idx)
              block=s[idx:end]
              block=block.replace(anchor,anchor+"/* UAF_STAGE13_POST_ROUTING */if(stage13PostAction_(a))return stage13Post_(a,d);",1)
              s=s[:idx]+block+s[end:]; changed=True
          if '/* UAF_STAGE13_SETUP_TRIGGER */' not in s:
              insert="\n/* UAF_STAGE13_SETUP_TRIGGER */\nfunction initializeStage13(){permission_('update');return json_({ok:true,message:setupStage13()});}\n"
              s+=insert; changed=True
          if changed:p.write_text(s)
      - name: Integrate Stage 13 navigation
        shell: python
        run: |
          from pathlib import Path
          p=Path('frontend/index.html')
          if not p.exists(): raise SystemExit('frontend/index.html not found')
          s=p.read_text()
          if 'UAF_STAGE13_NAV' not in s:
              nav='<!-- UAF_STAGE13_NAV --><button onclick="location.href=\'stage13.html\'">HR & Workplans</button>'
              anchors=['stage12.html','stage11.html','stage10.html']
              inserted=False
              for a in anchors:
                  marker=f'>{a}'
                  if marker in s:
                      pos=s.find(marker)
                      end=s.find('</button>',pos)
                      if end>=0:
                          s=s[:end+9]+nav+s[end+9:]; inserted=True; break
              if not inserted:
                  s=s.replace('</body>',nav+'</body>',1)
              p.write_text(s)
      - name: Commit integration
        run: |
          git config user.name 'UAF Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add apps-script/Setup.gs frontend/index.html
          git diff --cached --quiet || git commit -m 'Integrate Stage 13 HR and workplan management'
          git push
