name: Integrate Stage 11 UI
on:
  push:
    branches: [main]
    paths:
      - 'frontend/stage11.html'
      - '.github/workflows/integrate-stage11-ui.yml'
permissions:
  contents: write
jobs:
  integrate-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Financial M&E navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/index.html')
          s=p.read_text()
          marker='<button onclick="window.location.href=\'stage8.html\'">Data Quality</button>'
          add=marker+'<button onclick="window.location.href=\'stage11.html\'">Financial M&E</button>'
          if 'stage11.html' not in s:
              if marker not in s: raise SystemExit('Stage 8 navigation marker not found')
              s=s.replace(marker,add,1)
          if 'stage11.html' not in s: raise SystemExit('Stage 11 navigation not integrated')
          p.write_text(s)
          PY
      - name: Publish standalone Stage 11 page
        run: test -f frontend/stage11.html
      - name: Commit UI integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/index.html
          git diff --cached --quiet || git commit -m 'Add Financial M&E navigation to main UI'
          git push
