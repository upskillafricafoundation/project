name: Integrate Stage 18 UI
on:
  push:
    paths: ['frontend/stage18.html','.github/workflows/integrate-stage18-ui.yml']
  workflow_dispatch:
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: Add Stage 18 navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/index.html'); s=p.read_text(); marker='UAF_STAGE18_NAV'
          if marker not in s:
              link='<!-- UAF_STAGE18_NAV --><a href="stage18.html">Safeguarding & Protection</a>'
              for a in ['stage17.html','stage16.html','stage15.html','stage14.html']:
                  if a in s:
                      i=s.find(a); e=s.find('>',i)
                      if e>=0: s=s[:e+1]+link+s[e+1:]; break
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/index.html
          git diff --cached --quiet || git commit -m 'Integrate Stage 18 into main UI'
          git push