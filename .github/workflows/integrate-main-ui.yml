name: Integrate Main M&E UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate-main-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrate Stage 7 and Stage 8 navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'UAF_STAGE78_NAV'
          if marker not in s:
              old_nav = '<button onclick="page(\'reports\');reports()">Reports</button>'
              new_nav = old_nav + '<span id="UAF_STAGE78_NAV"></span><button onclick="window.location.href=\'stage7.html\'">Strategic Learning</button><button onclick="window.location.href=\'stage8.html\'">Data Quality</button>'
              if old_nav not in s:
                  raise SystemExit('Main navigation anchor not found')
              s = s.replace(old_nav, new_nav, 1)
          s = s.replace('Digital Monitoring, Evaluation & Learning System · Stage 5', 'Digital Monitoring, Evaluation & Learning System · Stage 8', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate integration
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('frontend/index.html').read_text(encoding='utf-8')
          required = ['UAF_STAGE78_NAV', "stage7.html", "stage8.html", 'Stage 8']
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing integration markers: ' + ', '.join(missing))
          print('Main M&E UI integration validated.')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/index.html
          git diff --cached --quiet || git commit -m 'Integrate Stage 7 and Stage 8 into main UI'
          git push