name: Validate Unified M&E/L Frontend

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-main-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate unified frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/index.html')
          s = p.read_text(encoding='utf-8')
          required = [
              'config.js',
              'Unified Digital Monitoring, Evaluation & Learning System',
              'executive.html',
              'stage7.html',
              'stage8.html',
              'stage10.html',
              'stage11.html',
              'stage12.html',
              'stage13.html',
              'stage14.html',
              'stage15.html',
              'stage16.html',
              'stage17.html',
              'stage18.html',
              'stage19.html'
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing unified frontend markers: ' + ', '.join(missing))
          print('Unified M&E/L frontend validation passed.')
          PY
