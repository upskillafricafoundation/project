name: Integrate Stage 9
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate Stage 9 routes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps-script/Setup.gs')
          s=p.read_text()
          marker='/* UAF_STAGE9_GET_ROUTING */'
          get='if(a===\'currentUser\')return currentUser_();'
          if marker not in s:
              s=s.replace(get,get+marker+'if(stage9GetAction_(a))return stage9Get_(a,e);',1)
          marker2='/* UAF_STAGE9_POST_ROUTING */'
          post='var d=JSON.parse(e.postData.contents||\'{}\'),a=d.action||\'create\';'
          if marker2 not in s:
              s=s.replace(post,post+marker2+'if(stage9PostAction_(a))return stage9Post_(a,d);',1)
          p.write_text(s)
          if marker not in s or marker2 not in s or 'stage9GetAction_' not in s:
              raise SystemExit('Stage 9 integration validation failed')
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/Setup.gs
          git diff --cached --quiet || git commit -m 'Integrate Stage 9 API routing'
          git push