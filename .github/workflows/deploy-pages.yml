name: Deploy UAF Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify unified frontend
        shell: bash
        run: |
          test -f frontend/index.html
          test -f frontend/config.js
          ! grep -qi '<iframe' frontend/index.html
          grep -q 'UAF_NATIVE' frontend/index.html
          for f in frontend/stage*.html; do
            test -f "$f"
            base=$(basename "$f")
            grep -q "$base" frontend/index.html || { echo "Missing embedded module: $base"; exit 1; }
          done
          echo "Unified frontend and all stage source modules verified."

      - name: Prepare Pages artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R frontend/. _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/config.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
