name: Integrate Stage 12 Resource M&E
on:
  push:
    branches: [main]
    paths:
      - 'apps-script/Stage12.gs'
      - '.github/workflows/integrate-stage12.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate Stage 12 into Setup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps-script/Setup.gs'); s=p.read_text()
          get="/* UAF_STAGE12_GET_ROUTING */if(stage12GetAction_(a))return stage12Get_(a,e);"
          post="/* UAF_STAGE12_POST_ROUTING */if(stage12PostAction_(a))return stage12Post_(a,d);"
          anchor="if(a==='currentUser')return currentUser_();"
          if 'UAF_STAGE12_GET_ROUTING' not in s:
              if anchor not in s: raise SystemExit('GET anchor not found')
              s=s.replace(anchor,anchor+get,1)
          if 'UAF_STAGE12_POST_ROUTING' not in s:
              if anchor not in s: raise SystemExit('POST anchor not found')
              s=s.replace(anchor,anchor+post,1)
          p.write_text(s)
          PY
          grep -q 'UAF_STAGE12_GET_ROUTING' apps-script/Setup.gs
          grep -q 'UAF_STAGE12_POST_ROUTING' apps-script/Setup.gs
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/Setup.gs
          git diff --cached --quiet || git commit -m 'Integrate Stage 12 resource routes into Setup'
          git push
