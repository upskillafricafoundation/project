name: Integrate UAF Stage 14 UI
on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/stage14.html'
      - '.github/workflows/integrate-stage14-ui.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add Stage 14 navigation entry when a matching main UI hook exists
        shell: python
        run: |
          from pathlib import Path
          p=Path('frontend/index.html')
          if not p.exists(): raise SystemExit('frontend/index.html not found')
          s=p.read_text()
          if 'stage14.html' not in s:
              button='<a href="stage14.html">Communications & Advocacy M&E</a>'
              anchors=['stage13.html','stage12.html','stage11.html']
              done=False
              for a in anchors:
                  token='href="'+a+'"'
                  if token in s:
                      i=s.find(token)
                      end=s.find('</a>',i)
                      if end>=0:
                          end+=4
                          s=s[:end]+' '+button+s[end:]
                          done=True
                          break
              if not done:
                  # Do not guess the application's DOM structure.
                  raise SystemExit('No Stage 11/12/13 navigation anchor found; UI not modified')
              p.write_text(s)
      - name: Commit UI integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/index.html
          git diff --cached --quiet || git commit -m 'Integrate Stage 14 navigation into main UI'
          git push
