name: Build Unified Frontend Index

on:
  push:
    branches: [main]
    paths:
      - 'frontend/index.html'
      - 'frontend/config.js'
      - 'frontend/executive.html'
      - 'frontend/stage*.html'
      - '.github/workflows/build-unified-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build embedded module bundle
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          root = Path('frontend')
          base = root / 'index.html'
          source = base.read_text(encoding='utf-8')

          files = ['executive.html'] + [f'stage{i}.html' for i in range(7, 20)]
          modules = {}
          for name in files:
              p = root / name
              if not p.exists():
                  continue
              raw = p.read_text(encoding='utf-8')
              body = re.search(r'<body[^>]*>(.*)</body>', raw, re.I | re.S)
              styles = re.findall(r'<style[^>]*>(.*?)</style>', raw, re.I | re.S)
              scripts = re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', raw, re.I | re.S)
              if body:
                  modules[name] = {
                      'body': body.group(1),
                      'styles': '\n'.join(styles),
                      'scripts': '\n'.join(scripts),
                  }

          marker = '<!-- UAF_EMBEDDED_MODULES -->'
          payload = json.dumps(modules, ensure_ascii=False, separators=(',', ':'))

          if marker in source:
              source = source.split(marker, 1)[0] + marker + '\n<script>window.UAF_EMBEDDED_MODULES=' + payload + ';</script>\n</body>\n</html>\n'
          else:
              source = source.replace('</body>', marker + '\n<script>window.UAF_EMBEDDED_MODULES=' + payload + ';</script>\n</body>')

          old = 'frame.src=m.file;'
          new = '''const mod=window.UAF_EMBEDDED_MODULES?.[m.file];
          if(!mod){$('status').textContent='Module source not embedded: '+m.file;return;}
          const childApi=JSON.stringify(window.API_URL);
          const safeScript=String(mod.scripts||'').replace(/<\\/script>/gi,'<\\\\/script>');
          frame.srcdoc='<!doctype html><html><head><meta charset="utf-8"><style>'+String(mod.styles||'')+'</style></head><body>'+String(mod.body||'')+'<script>const API_URL='+childApi+';<\\/script><script>'+safeScript+'<\\/script></body></html>';'''
          if old in source:
              source = source.replace(old, new)
          else:
              raise SystemExit('Expected iframe navigation statement not found')

          base.write_text(source, encoding='utf-8')
      - name: Validate generated index
        run: |
          test -s frontend/index.html
          grep -q 'UAF_EMBEDDED_MODULES' frontend/index.html
          grep -q 'stage7.html' frontend/index.html
          grep -q 'stage19.html' frontend/index.html
          grep -q 'srcdoc' frontend/index.html
      - name: Commit generated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Build single-file unified frontend [skip ci]'
          git push
