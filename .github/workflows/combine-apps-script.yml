name: Combine Apps Script

on:
  push:
    paths:
      - 'apps-script/*.gs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  combine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Combine all Apps Script source files
        shell: bash
        run: |
          set -euo pipefail
          out="apps-script/Code.gs"
          tmp="apps-script/Code.gs.tmp"
          : > "$tmp"

          files=(
            "apps-script/Setup.gs"
            "apps-script/Stage3.gs"
            "apps-script/Stage7.gs"
            "apps-script/Stage7Router.gs"
            "apps-script/Stage8.gs"
            "apps-script/Stage10.gs"
            "apps-script/Stage11.gs"
            "apps-script/Stage12.gs"
            "apps-script/Stage13.gs"
            "apps-script/Stage14.gs"
            "apps-script/Stage15.gs"
            "apps-script/Stage16.gs"
            "apps-script/Stage17.gs"
            "apps-script/Stage18.gs"
            "apps-script/Stage19.gs"
          )

          for f in "${files[@]}"; do
            if [[ -f "$f" ]]; then
              printf '\n\n/************************************************************\n * SOURCE: %s\n ************************************************************/\n\n' "$f" >> "$tmp"
              cat "$f" >> "$tmp"
              printf '\n' >> "$tmp"
            fi
          done

          mv "$tmp" "$out"
          rm -f apps-script/BUILD_TRIGGER.gs

      - name: Commit combined Code.gs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Code.gs apps-script/BUILD_TRIGGER.gs
          if git diff --cached --quiet; then
            echo "Code.gs is already up to date."
            exit 0
          fi
          git commit -m "Generate single combined Apps Script Code.gs"
          git push
