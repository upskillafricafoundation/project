name: Combine Apps Script

on:
  push:
    paths:
      - 'apps-script/*.gs'
      - '.github/workflows/combine-apps-script.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  combine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Combine all Apps Script source files
        shell: bash
        run: |
          set -euo pipefail
          out="apps-script/Code.gs"
          tmp="apps-script/Code.gs.tmp"
          : > "$tmp"

          # Setup contains the core system/router. Stage files contain later modules.
          # Keep an explicit deterministic order so the generated file is reproducible.
          files=(
            "apps-script/Setup.gs"
            "apps-script/Stage3.gs"
            "apps-script/Stage7.gs"
            "apps-script/Stage7Router.gs"
            "apps-script/Stage8.gs"
            "apps-script/Stage10.gs"
            "apps-script/Stage11.gs"
            "apps-script/Stage12.gs"
            "apps-script/Stage13.gs"
            "apps-script/Stage14.gs"
            "apps-script/Stage15.gs"
            "apps-script/Stage16.gs"
            "apps-script/Stage17.gs"
            "apps-script/Stage18.gs"
            "apps-script/Stage19.gs"
          )

          for f in "${files[@]}"; do
            if [[ -f "$f" ]]; then
              printf '\n\n/************************************************************\n * SOURCE: %s\n ************************************************************/\n\n' "$f" >> "$tmp"
              cat "$f" >> "$tmp"
              printf '\n' >> "$tmp"
            fi
          done

          mv "$tmp" "$out"

      - name: Remove split source files
        shell: bash
        run: |
          set -euo pipefail
          rm -f apps-script/Setup.gs \
                apps-script/Stage3.gs \
                apps-script/Stage7.gs \
                apps-script/Stage7Router.gs \
                apps-script/Stage8.gs \
                apps-script/Stage10.gs \
                apps-script/Stage11.gs \
                apps-script/Stage12.gs \
                apps-script/Stage13.gs \
                apps-script/Stage14.gs \
                apps-script/Stage15.gs \
                apps-script/Stage16.gs \
                apps-script/Stage17.gs \
                apps-script/Stage18.gs \
                apps-script/Stage19.gs

      - name: Commit single-file Apps Script
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Code.gs apps-script/*.gs
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Combine UAF M&E Apps Script into single Code.gs"
          git push
